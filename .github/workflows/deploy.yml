name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The built site is published to the gh-pages branch, which GitHub Pages
# serves. That needs write access to the repository contents and nothing else.
permissions:
  contents: write

# Let a newer push queue behind an in-flight deploy, but never interrupt one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
        env:
          # GitHub Pages serves a project site from /<repo>/, so the bundle,
          # the manifest and the service worker scope all need that prefix.
          # With a custom domain the site is at the root instead: set the
          # repository variable BASE_PATH to "/" (Settings → Secrets and
          # variables → Actions → Variables).
          BASE_PATH: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
      - name: Publish dist to gh-pages
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # .nojekyll stops Pages running the files through Jekyll, which
          # would drop anything starting with an underscore.
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish site from ${GITHUB_SHA::7}"
          # The branch holds build output only, so each deploy replaces it.
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
